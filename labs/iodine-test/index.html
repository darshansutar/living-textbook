<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b">
<title>Lab: Test a Leaf for Starch</title>
<link rel="stylesheet" href="lab.css">
</head>
<body data-screen="title">
<!-- Living Textbook lab prototype (2026-11-06): NCERT Class 7 Science, Activity 10.2 (iodine test on a leaf).
     three.js r158 + GSAP 3.12.5, both in vendor/; every object is built in code (no model files), so it runs offline from file://. -->
<div id="frame">
  <canvas id="scene"></canvas>
  <div id="chips" aria-hidden="true"></div>
  <span id="pointer" hidden><i></i></span>
  <div id="drops"></div>

  <section id="title" class="screen on">
    <div class="scrim"></div>
    <div class="title-block">
      <p class="kicker">Class 7 · Science · Activity 10.2 · Lab</p>
      <h1>Does a leaf store food?</h1>
      <p class="sub">Test a leaf for starch on the lab bench. Tap what the class tells you to use, step by step.</p>
      <button class="btn big" id="start" type="button">Start the lab <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></svg></button>
    </div>
  </section>

  <header id="hud">
    <div class="steps"><p id="stepno"></p><ol id="progress"></ol></div>
  </header>

  <aside id="card" aria-live="polite">
    <h2 id="steptitle"></h2>
    <div class="guide">
      <span class="avatar">ST</span>
      <div><p class="who"><b>Shanta Teacher</b><span>Science teacher</span><button id="hear" type="button" title="Hear again"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg></button></p><p id="say"></p></div>
    </div>
    <div id="hint" hidden><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L9 14"/></svg><span id="hinttext"></span><button id="showme" type="button">Show me</button></div>
    <div id="choices" hidden></div>
    <p id="feedback" hidden></p>
    <div id="actions"><button class="btn" id="next" type="button" hidden>Next <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></svg></button></div>
  </aside>

  <p id="status"><i></i><span></span></p>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="lab.js"></script>
</body>
</html>
