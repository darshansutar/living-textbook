<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0d0b">
<title>Smart switch lab: focus sample</title>
<link rel="stylesheet" href="workbench.css">
<link rel="stylesheet" href="fig.css">
<link rel="stylesheet" href="lab-embed.css">
<link rel="stylesheet" href="sample.css">
</head>
<body data-screen="title">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
<symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
<symbol id="i-again" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></symbol>
<symbol id="i-voice" viewBox="0 0 24 24"><path d="M4 5h16v11h-8.5L7 20v-4H4z"/><path d="M10.5 8.3v4.4l3.8-2.2z"/></symbol>
<symbol id="i-tap" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L9 14"/></symbol>
<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 15.8a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r=".8"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r=".9"/><circle cx="4.5" cy="12" r=".9"/><circle cx="4.5" cy="17.5" r=".9"/></symbol>
<symbol id="i-sign" viewBox="0 0 24 24"><path d="M13.5 2.5 5 13.5h6l-1 8 8.5-11h-6z"/></symbol>
<symbol id="i-off" viewBox="0 0 24 24"><path d="M12 3v8M7 6.3a7.5 7.5 0 1 0 10 0"/></symbol>
<symbol id="i-hat" viewBox="0 0 24 24"><path d="M3 17h18M4.5 17a7.5 7.5 0 0 1 15 0M10 9.8V7a2 2 0 0 1 4 0v2.8"/></symbol>
</svg>
<div id="frame">
  <div id="stage" class="iso" data-theme="dark">
    <div id="chips" aria-hidden="true"></div>
    <span id="pointer" hidden><i class="ring"></i><svg><use href="#i-tap"/></svg></span>
    <div id="focus"><p id="readout" aria-live="polite"><svg><use href="#i-sign"/></svg><span></span></p></div>
  </div>

  <section class="screen" id="s_title">
    <div class="scrim" aria-hidden="true"></div>
    
    <div class="title-block">
      <p class="kicker" id="t_kicker"></p>
      <h1 id="t_title"></h1>
      <p class="sub" id="t_sub"></p>
      <div id="langs" class="langs" hidden></div>
      <button class="btn big" id="t_start" type="button"></button>
      <a class="backlink" id="t_more" href="/stories"></a>
    </div>
  </section>

  <section class="screen" id="s_menu" inert>
    <div class="scrim" aria-hidden="true"></div>
    <div class="menu-top">
      <button class="pill" id="m_back" type="button"><svg class="flip"><use href="#i-arrow"/></svg><span></span></button>
      <button class="pill" id="m_mute" type="button" aria-pressed="false"><svg><use href="#i-sound"/></svg><span></span></button>
    </div>
    <nav class="hub" aria-labelledby="hub_head">
      <h2 id="hub_head"></h2>
      <ol id="hub"></ol>
      <a class="backlink" id="m_more" href="/stories"></a>
    </nav>
  </section>

  <header id="hud">
    <div class="where">
      <button class="tool" id="toHub" type="button"><svg><use href="#i-list"/></svg><span></span></button>
      <div class="steps"><p id="stepno"></p><ol id="progress" aria-hidden="true"></ol></div>
    </div>
    <div class="where tools">
      <button class="tool" id="replay" type="button"><svg><use href="#i-voice"/></svg><span></span></button>
      <button class="tool" id="mute" type="button" aria-pressed="false"><svg><use href="#i-sound"/></svg><span class="tip"></span></button>
    </div>
  </header>

  <aside id="panel" aria-live="polite">
    <div id="work">
      <h2 id="steptitle"></h2>
      <div id="ravi">
        <span class="avatar"><svg><use href="#i-hat"/></svg></span>
        <div><p class="who"><b id="guideName"></b><span id="guideRole"></span></p><p id="bubble"></p></div>
      </div>
      <div id="hint" hidden><svg><use href="#i-tap"/></svg><span id="hintText"></span><button id="showme" type="button"></button></div>
      <div id="choices" hidden></div>
      <p id="feedback" class="feedback" hidden><span></span></p>
      <div id="actions"></div>
    </div>
    <div id="endcard">
      <p id="end_kind"></p>
      <h2 id="end_head"></h2>
      <p id="end_sub"></p>
      <p id="end_note"></p>
      <ol id="end_list"></ol>
      <p id="end_all" hidden></p>
      <div class="end-actions">
        <button class="btn" id="end_next" type="button"><span></span><svg><use href="#i-arrow"/></svg></button>
        <button class="btn ghost" id="end_again" type="button" hidden><svg><use href="#i-again"/></svg><span></span></button>
        <button class="btn ghost" id="end_hub" type="button"><svg><use href="#i-list"/></svg><span></span></button>
        <a class="btn ghost" id="end_more" href="/stories"></a>
      </div>
    </div>
  </aside>
</div>
<!-- Living Textbook lab (2026-11-17): the en2 Starling workbench look (board figure, player and styles copied),
     running this lesson's 9-step job from lesson.js (generated from script.json by build_lab.py). Works offline. -->
<script src="figure.js"></script>
<script src="lesson.js"></script>
<script src="adapter.js"></script>
<script src="figscript.js"></script>
<script src="focus.js"></script>
<script src="wb.js"></script>
<script src="adapter-after.js"></script>
</body>
</html>
