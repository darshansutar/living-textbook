<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0d0b">
<title>Sample: Make the welding area safe</title>
<link rel="stylesheet" href="workbench.css">
<link rel="stylesheet" href="bay.css">
</head>
<body data-screen="title">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></symbol>
<symbol id="i-tap" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L9 14"/></symbol>
<symbol id="i-sign" viewBox="0 0 24 24"><path d="M12 21a6 6 0 0 1-6-6c0-4 3.5-6 3.5-10 2.5 1.5 4 3.5 4.5 6 1-1 1.5-2.2 1.5-3.5C18 10 18 12.5 18 15a6 6 0 0 1-6 6z"/></symbol>
<symbol id="i-off" viewBox="0 0 24 24"><path d="M12 3v8M7 6.3a7.5 7.5 0 1 0 10 0"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
<symbol id="i-voice" viewBox="0 0 24 24"><path d="M4 5h16v11h-8.5L7 20v-4H4z"/><path d="M10.5 8.3v4.4l3.8-2.2z"/></symbol>
</svg>
<div id="frame">
  <div id="stage" class="iso" data-theme="dark">
    <div id="chips" aria-hidden="true"></div>
    <span id="pointer" hidden><i class="ring"></i><svg><use href="#i-tap"/></svg></span>
    <div id="focus"><p id="readout" aria-live="polite"><svg><use href="#i-sign"/></svg><span></span></p></div>
  </div>

  <section class="screen" id="s_title">
    <div class="scrim" aria-hidden="true"></div>
    <div class="title-block">
      <p class="kicker">ITI Fitter · Welding · Safety job</p>
      <h1>Make the welding area safe</h1>
      <p class="sub">Basavaraj anna wants the bay safe before Mallesh strikes an arc. Four checks, one at a time.</p>
      <button class="btn big" id="t_start" type="button"><span>Start the job</span><svg><use href="#i-arrow"/></svg></button>
    </div>
  </section>

  <header id="hud">
    <div class="where"><div class="steps"><p id="stepno"></p><ol id="progress" aria-hidden="true"></ol></div></div>
  </header>

  <aside id="panel" aria-live="polite">
    <div id="work">
      <h2 id="steptitle"></h2>
      <div id="ravi">
        <span class="avatar"><svg><use href="#i-sign"/></svg></span>
        <div><p class="who"><b>Basavaraj anna</b><span>Welding teacher</span></p><p id="bubble"></p></div>
      </div>
      <div id="hint" hidden><svg><use href="#i-tap"/></svg><span id="hintText"></span><button id="showme" type="button">Show me</button></div>
      <div id="choices" hidden></div>
      <p id="feedback" class="feedback" hidden><span></span></p>
      <div id="actions"></div>
    </div>
    <div id="endcard">
      <p id="end_kind"></p>
      <h2 id="end_head"></h2>
      <p id="end_sub"></p>
      <ol id="end_list"></ol>
      <div class="end-actions"><button class="btn ghost" id="end_again" type="button"><span>Do it again</span></button>
        <button class="btn ghost" id="end_back" type="button"><span>Back to the overview</span></button></div>
    </div>
  </aside>
</div>
<script src="lab.js"></script>
</body>
</html>
